<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mint Tracker — Chishiya &amp; Creyzsa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6eef4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#bg)"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="16.4" fill="none" stroke="#e6dbe6" stroke-width="1.2"/>

  <!-- dua lingkaran bertumpuk: biru = Chishiya, pink = Creyzsa -->
